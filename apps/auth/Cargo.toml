[package]
name = "auth"
version = "0.0.3"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.3", features = ["json", "multipart", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "time", "uuid", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum-extra = { version = "0.10", features = ["cookie"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
argon2 = "0.5.3"
redis = { version = "1.2.2", features = ["r2d2", "tokio-comp"] }
r2d2 = "0.8.10"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
base64 = "0.22"
prometheus = { version = "0.14.0", features = ["process", "reqwest"] }
rand = "0.8"
axum-test = "20.1.0"
sha2 = "0.11.0"
hex = "0.4.3"
app_schema = { path = "../../packages/schema" }
