[package]
name = "backend"
version = "0.0.1"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "time", "uuid", "chrono"] }
redis = { version = "1.2.2", features = ["r2d2", "tokio-comp"] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
prometheus = { version = "0.14.0", features = ["process", "reqwest"] }
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0.102"
axum-test = "20.1.0"
app_schema = { path = "../../packages/schema" }
reqwest = { version = "0.13.3", features = ["json", "multipart", "form"] }
serde = { version = "1.0", features = ["derive"] }
